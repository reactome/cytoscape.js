<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>cytoscape.js — SVG export visual diff harness</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 16px; background: #f4f4f4; }
    h1 { font-size: 18px; margin: 0 0 12px 0; }
    h2 { font-size: 14px; margin: 0 0 6px 0; color: #444; }
    .test { background: #fff; border: 1px solid #ccc; padding: 12px; margin: 0 0 16px 0; }
    .panes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .pane { border: 1px solid #ddd; padding: 6px; }
    .label { font-size: 12px; color: #666; margin-bottom: 4px; }
    .canvas-host { width: 100%; height: 320px; position: relative; background: #fafafa; }
    img.png-out, .svg-host { width: 100%; height: 320px; background: #fafafa; object-fit: contain; }
    .svg-host > svg { width: 100%; height: 100%; display: block; }
    pre.errors { color: #c00; white-space: pre-wrap; max-height: 200px; overflow: auto; font-size: 11px; }
    button { margin: 0 4px; }
    .controls { margin-bottom: 12px; }
    .summary { font-weight: bold; }
  </style>
  <script src="/build/cytoscape.umd.js"></script>
</head>
<body>
  <h1>cytoscape.js — SVG export visual diff harness</h1>
  <div class="controls">
    <button id="run-all">Re-run all</button>
    <span class="summary" id="summary"></span>
  </div>
  <div id="tests"></div>

<script>
"use strict";

// ---------- test fixtures ----------

    elements: [

      { data: { id: 'c', label: 'triangle' }, position: { x: 360, y: 80 } },
      { data: { id: 'd', label: 'ellipse' }, position: { x: 80, y: 220 } },
      { data: { id: 'e', label: 'star' }, position: { x: 220, y: 220 } },
      { data: { id: 'f', label: 'hex' }, position: { x: 360, y: 220 } },
      { data: { source: 'a', target: 'b' } },
      { data: { source: 'b', target: 'c' } },
      { data: { source: 'd', target: 'e' } },
      { data: { source: 'e', target: 'f' } },
      { data: { source: 'a', target: 'd' } },
    ],
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'background-color': '#0091ff', 'color': '#fff',
        'text-valign': 'center', 'text-halign': 'center', 'font-size': 12,
        'border-color': '#000', 'border-width': 1.5, 'width': 60, 'height': 60,

      { selector: '#a', style: { 'shape': 'ellipse' } },

      { selector: '#d', style: { 'shape': 'ellipse', 'width': 80, 'height': 50 } },

      { selector: 'edge', style: { 'curve-style': 'straight', 'width': 2, 'line-color': '#666' } }
    ],
  },
  {
    id: 'compound',
    title: '2. Compound nodes (parents with backgrounds + padding)',
    elements: [
      { data: { id: 'p1' } },
      { data: { id: 'p2' } },
      { data: { id: 'a', parent: 'p1' }, position: { x: 80, y: 100 } },
      { data: { id: 'b', parent: 'p1' }, position: { x: 180, y: 100 } },
      { data: { id: 'c', parent: 'p2' }, position: { x: 320, y: 100 } },

      { data: { source: 'a', target: 'c' } },
      { data: { source: 'b', target: 'd' } },
    ],

      { selector: 'node', style: {
        'label': 'data(id)', 'text-valign': 'center', 'text-halign': 'center',
        'background-color': '#88c', 'width': 50, 'height': 50, 'font-size': 12,
      } },
      { selector: ':parent', style: {
        'label': 'data(id)', 'background-color': '#fdd', 'background-opacity': 0.8,
        'border-color': '#933', 'border-width': 2, 'padding': 20,
        'text-valign': 'top', 'text-halign': 'center',
      } },
      { selector: 'edge', style: { 'curve-style': 'bezier', 'width': 2, 'line-color': '#444' } }
    ],

    title: '3. Image-backed nodes (data: URI to avoid CORS)',
    elements: [
      { data: { id: 'a' }, position: { x: 100, y: 120 } },
      { data: { id: 'b' }, position: { x: 280, y: 120 } },
      { data: { source: 'a', target: 'b' } },
    ],
    style: [
      { selector: 'node', style: {
        'background-image': 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCI+PHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjgwIiBmaWxsPSIjOEU3Q0MzIi8+PGNpcmNsZSBjeD0iNDAiIGN5PSI0MCIgcj0iMjAiIGZpbGw9IiNGRkUwNkIiLz48L3N2Zz4=',
        'background-fit': 'contain', 'background-color': '#eef',
        'width': 80, 'height': 80, 'border-color': '#222', 'border-width': 2,
        'shape': 'rectangle', 'label': 'data(id)', 'text-valign': 'bottom', 'text-margin-y': 4,
      } },
      { selector: 'edge', style: { 'curve-style': 'straight', 'width': 2, 'line-color': '#000' } }
    ],

      { data: { id: 'd' }, position: { x: 280, y: 240 } },
      { data: { id: 'ab', source: 'a', target: 'b' } },
      { data: { id: 'cd', source: 'c', target: 'd' } },
      { data: { id: 'ac', source: 'a', target: 'c' } },
      { data: { id: 'bd', source: 'b', target: 'd' } },
    ],
    style: [
      { selector: 'node', style: {
        'background-color': '#0a0', 'label': 'data(id)', 'color': '#fff',
        'text-valign': 'center', 'text-halign': 'center', 'width': 40, 'height': 40,
      } },
      { selector: 'edge', style: { 'width': 3, 'line-color': '#345', 'target-arrow-color': '#345' } },
      { selector: '#ab', style: { 'curve-style': 'bezier', 'line-style': 'solid', 'target-arrow-shape': 'triangle' } },
      { selector: '#cd', style: { 'curve-style': 'bezier', 'line-style': 'dashed', 'target-arrow-shape': 'vee' } },
      { selector: '#ac', style: { 'curve-style': 'taxi', 'line-style': 'dotted', 'target-arrow-shape': 'circle' } },
      { selector: '#bd', style: { 'curve-style': 'segments', 'segment-distances': [40], 'segment-weights': [0.5], 'line-style': 'dashed', 'target-arrow-shape': 'square' } },

  },
  {

      { selector: '#d', style: { 'text-background-color': '#ff0', 'text-background-opacity': 0.85, 'text-background-padding': 4, 'text-border-color': '#a00', 'text-border-width': 1, 'text-border-opacity': 1, 'color': '#000' } },

      { data: { id: 'c', label: 'opacity' }, position: { x: 440, y: 110 } },
      { data: { id: 'p1' } },
      { data: { id: 'd', parent: 'p1', label: 'child' }, position: { x: 200, y: 250 } },
      { data: { source: 'a', target: 'b' } },
      { data: { source: 'b', target: 'c' } },
    ],
    style: [
      { selector: 'node', style: {
        'label': 'data(label)', 'color': '#000', 'text-valign': 'center', 'text-halign': 'center',
        'width': 80, 'height': 80, 'font-size': 12,
      } },
      { selector: '#a', style: {
        'background-fill': 'linear-gradient', 'background-gradient-direction': 'to-bottom',
        'background-gradient-stop-colors': '#ff0 #f00 #00f',
      } },
      { selector: '#b', style: {
        'background-fill': 'radial-gradient',
        'background-gradient-stop-colors': '#fff #08f',
      } },
      { selector: '#c', style: { 'background-color': '#00a', 'opacity': 0.4 } },
      { selector: ':parent', style: {
        'background-color': '#cfc', 'border-color': '#070', 'border-width': 2,
        'opacity': 0.6, 'padding': 30, 'label': 'parent', 'text-valign': 'top',
      } },
      { selector: 'edge', style: { 'curve-style': 'bezier', 'width': 2 } },
    ],
  },
];

// ---------- harness ----------
function makeTest( fix ){
  const root = document.createElement('div');
  root.className = 'test';
  root.innerHTML = `
    <h2>${fix.title}</h2>
    <div class="panes">
      <div class="pane">
        <div class="label">cytoscape (live canvas)</div>
        <div class="canvas-host" id="${fix.id}-canvas"></div>
      </div>
      <div class="pane">
        <div class="label">cy.png() output</div>
        <img class="png-out" id="${fix.id}-png" />
      </div>
      <div class="pane">
        <div class="label">cy.svg() output</div>
        <div class="svg-host" id="${fix.id}-svg"></div>
      </div>
    </div>
    <pre class="errors" id="${fix.id}-err"></pre>
  `;
  return root;
}

const errsByFix = {};

function logErr( id, e ){
  errsByFix[id] = (errsByFix[id] || '') + (e && e.stack ? e.stack : String(e)) + '\n';
  document.getElementById(id + '-err').textContent = errsByFix[id];
}

async function runFixture( fix ){
  errsByFix[fix.id] = '';
  document.getElementById(fix.id + '-err').textContent = '';
  const host = document.getElementById(fix.id + '-canvas');
  host.innerHTML = '';

  const cy = cytoscape({
    container: host,
    elements: fix.elements,
    style: fix.style,
    layout: { name: 'preset' },
    pixelRatio: 1,
  });

  // Wait for layout/render. Keep short — playwright is also using setTimeout.
  await new Promise(r => setTimeout(r, 200));
  cy.resize();
  cy.fit(undefined, 20);
  await new Promise(r => setTimeout(r, 100));

  // PNG
  try {
    const png = cy.png({ output: 'base64uri', full: true, scale: 1, bg: '#ffffff' });
    document.getElementById(fix.id + '-png').src = png;
  } catch( e ){ logErr(fix.id, e); }

  // SVG
  try {
    const svg = cy.svg({ full: true, scale: 1, bg: '#ffffff' });
    document.getElementById(fix.id + '-svg').innerHTML = svg;
    // Also expose for inspection
    window.lastSvg = window.lastSvg || {};
    window.lastSvg[fix.id] = svg;
  } catch( e ){ logErr(fix.id, e); }

  return cy;
}

async function runAll(){
  const tests = document.getElementById('tests');
  tests.innerHTML = '';
  for( const fix of fixtures ){
    tests.appendChild( makeTest( fix ) );
  }
  let ok = 0, fail = 0;
  for( const fix of fixtures ){
    try {
      await runFixture(fix);
      if( !errsByFix[fix.id] ) ok++; else fail++;
    } catch( e ){
      logErr(fix.id, e);
      fail++;
    }
  }
  document.getElementById('summary').textContent = `${ok} ok / ${fail} with errors`;
}

document.getElementById('run-all').addEventListener('click', runAll);
runAll();
</script>
</body>
</html>
